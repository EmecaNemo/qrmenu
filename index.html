<meta charset="utf-8" />
<title>Arda Büfe Menü</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Arda Büfe QR menü — kahvaltılar, tostlar, ana yemekler ve patso." />
<meta name="theme-color" content="#0C0A09" />

<style>
  /* ==========================================================================
     QR MENÜ — örnek şablon
     · Ürün ve fiyatlar: aşağıdaki MENU dizisi
     · Renk şemaları: PALETLER bölümü (4 hazır tema, alt bardan canlı değişir)
     · Fotoğraf: ürüne photo:"foto/tost.jpg" ekle, çizim yerine fotoğraf gelir
     ========================================================================== */

  /* ---------------------------------------------------------------- PALETLER */

  /* 1 · KÖMÜR — büfe, tost salonu, ocakbaşı (varsayılan) */
  :root,
  :root[data-palette="komur"] {
    --ink: #0C0A09;  --ink-2: #14100E;  --surface: #1A1512;  --rule: #2E2521;
    --accent: #E23A21;  --accent-ink: #FFFFFF;
    --text: #F6F0EA;  --muted: #A2938A;
    --scrim: rgba(12,10,9,.94);
    --glow-1: rgba(226,58,33,.10);  --glow-2: rgba(226,58,33,.05);
    --art-bg: linear-gradient(155deg, #2A211C, #16110E);
    --art-bg-2: linear-gradient(25deg, #241C18, #100C0A);
    --art-1: #E23A21;  --art-2: #6E5B50;  --art-3: #F0E4D6;
    --art-1alt: #6E5B50;  --art-2alt: #E23A21;
  }

  /* 2 · ZEYTİN — esnaf lokantası, kebapçı, ev yemekleri */
  :root[data-palette="zeytin"] {
    --ink: #0E120D;  --ink-2: #141A12;  --surface: #1B2218;  --rule: #2B3426;
    --accent: #C9A227;  --accent-ink: #14180F;
    --text: #EFEEE2;  --muted: #99A38C;
    --scrim: rgba(14,18,13,.94);
    --glow-1: rgba(201,162,39,.11);  --glow-2: rgba(201,162,39,.05);
    --art-bg: linear-gradient(155deg, #232C1E, #141A12);
    --art-bg-2: linear-gradient(25deg, #1E2619, #10150E);
    --art-1: #C9A227;  --art-2: #5E6B52;  --art-3: #EDEBD8;
    --art-1alt: #5E6B52;  --art-2alt: #C9A227;
  }

  /* 3 · MÜREKKEP — balık restoranı, meyhane, deniz ürünleri */
  :root[data-palette="murekkep"] {
    --ink: #08131C;  --ink-2: #0D1B26;  --surface: #12232F;  --rule: #1E3542;
    --accent: #D2793E;  --accent-ink: #0A1620;
    --text: #E9F0F4;  --muted: #8AA3B0;
    --scrim: rgba(8,19,28,.94);
    --glow-1: rgba(210,121,62,.12);  --glow-2: rgba(210,121,62,.05);
    --art-bg: linear-gradient(155deg, #142834, #0C1A24);
    --art-bg-2: linear-gradient(25deg, #102230, #091620);
    --art-1: #D2793E;  --art-2: #4A6B7C;  --art-3: #E6EEF2;
    --art-1alt: #4A6B7C;  --art-2alt: #D2793E;
  }

  /* 4 · KÂĞIT — kahvaltı salonu, pastane, kafe (açık tema) */
  :root[data-palette="kagit"] {
    --ink: #F5F1E8;  --ink-2: #EFE9DC;  --surface: #FFFFFF;  --rule: #DFD6C5;
    --accent: #7E2B3C;  --accent-ink: #FFF6F2;
    --text: #1E1A16;  --muted: #7A6E5F;
    --scrim: rgba(245,241,232,.94);
    --glow-1: rgba(126,43,60,.07);  --glow-2: rgba(126,43,60,.04);
    --art-bg: linear-gradient(155deg, #EFE7D6, #E4DAC4);
    --art-bg-2: linear-gradient(25deg, #EAE1CE, #F3ECDD);
    --art-1: #7E2B3C;  --art-2: #B5A489;  --art-3: #FBF7EE;
    --art-1alt: #B5A489;  --art-2alt: #7E2B3C;
  }

  /* ------------------------------------------------------------------ TEMEL */

  :root {
    --display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow",
               "Helvetica Neue", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --pad: clamp(16px, 5vw, 26px);
    --maxw: 640px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    transition: background .35s ease, color .35s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(120% 55% at 50% 0%, var(--glow-1), transparent 60%),
      radial-gradient(90% 45% at 50% 100%, var(--glow-2), transparent 65%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: var(--maxw);
    margin: 0 auto;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  /* --------------------------------------------------------------- BAŞLIK */

  header.masthead {
    padding: clamp(28px, 8vw, 48px) var(--pad) clamp(18px, 5vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 11px;
    align-items: center;
    text-align: center;
    border-bottom: 1px solid var(--rule);
  }

  .tagline {
    margin: 0;
    padding-left: .34em;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .34em;
    font-size: 11px;
    color: var(--muted);
  }

  .mark {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .15em;
    font-size: clamp(30px, 10vw, 46px);
    line-height: .95;
    text-wrap: balance;
  }
  .mark em { font-style: normal; color: var(--accent); }

  .rule-mark { width: 54px; height: 3px; background: var(--accent); }

  /* ------------------------------------------------- KATEGORİ ŞERİDİ */

  nav.jump {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--scrim);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }

  .jump-track {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 10px var(--pad);
    scroll-padding-inline: var(--pad);
  }
  .jump-track::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 7px 13px;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--muted);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .chip:hover { color: var(--text); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-current="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  /* ------------------------------------------------------------ BÖLÜMLER */

  section.course { scroll-margin-top: 60px; }

  .course-head {
    margin: 0;
    padding: 9px var(--pad);
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .13em;
    font-size: clamp(15px, 4.4vw, 18px);
  }

  .items {
    list-style: none;
    margin: 0;
    padding: 4px var(--pad) 20px;
    display: flex;
    flex-direction: column;
  }

  .item {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .item:last-child { border-bottom: 0; }

  .thumb {
    width: 64px;
    height: 64px;
    background: var(--art-bg);
    overflow: hidden;
    display: block;
  }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Aynı çizim alt alta tekrarlandığında tek tip görünmesin diye
     her satır dört varyanttan birini alır: renk vurgusu ve zemin döner. */
  .thumb[data-v="1"], .thumb[data-v="3"] {
    --art-1: var(--art-1alt);
    --art-2: var(--art-2alt);
  }
  .thumb[data-v="2"], .thumb[data-v="3"] { background: var(--art-bg-2); }

  .item-name { font-weight: 500; }

  .item-note {
    display: block;
    margin-top: 3px;
    font-size: 12.5px;
    line-height: 1.35;
    color: var(--muted);
  }

  .item-price {
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
    text-align: right;
  }
  .item-price .cur { color: var(--muted); font-size: 12px; margin-left: 3px; }

  /* --------------------------------------------------- SPESİYAL KARTI */

  .item.hero {
    display: block;
    padding: 0;
    margin: 14px 0 4px;
    border-bottom: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    overflow: hidden;
  }

  .hero-art {
    aspect-ratio: 16 / 7;
    background: var(--art-bg);
    display: grid;
    place-items: center;
  }
  .hero-art svg { width: 46%; max-width: 150px; height: auto; }
  .hero-art img { width: 100%; height: 100%; object-fit: cover; }

  .hero-body {
    padding: 14px 16px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: baseline;
  }

  .hero-tag {
    grid-column: 1 / -1;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .2em;
    font-size: 10.5px;
    color: var(--accent);
  }

  .hero-name {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .09em;
    font-size: 21px;
    line-height: 1.05;
  }

  .hero-price {
    margin: 0;
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    white-space: nowrap;
  }
  .hero-price .cur { color: var(--muted); font-size: 12px; margin-left: 3px; }

  .hero-desc {
    grid-column: 1 / -1;
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* ----------------------------------------------------------- ALT BİLGİ */

  footer.foot {
    margin-top: 10px;
    padding: 28px var(--pad) 0;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 9px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  footer.foot p { margin: 0; }
  footer.foot strong {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .2em;
    font-weight: 700;
    color: var(--text);
    font-size: 12px;
  }
  .updated { font-family: var(--num); font-size: 11px; }

  /* ------------------------------------------- RENK ŞEMASI BARI (demo) */

  .palette-bar {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--scrim);
    border: 1px solid var(--rule);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    transition: opacity .25s ease, transform .25s ease;
  }
  .palette-bar[hidden] { display: none; }

  .pb-label {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 10px;
    color: var(--muted);
    padding-left: 4px;
  }

  .pb-swatches { display: flex; gap: 6px; }

  .swatch {
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(128,128,128,.45);
    cursor: pointer;
    position: relative;
    transition: transform .18s ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .swatch[aria-pressed="true"] { transform: scale(1.15); border-color: var(--text); }
  .swatch[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
  }

  .pb-close {
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .pb-close:hover { color: var(--text); }
  .pb-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pb-reopen {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 40;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--scrim);
    color: var(--muted);
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .pb-reopen[hidden] { display: none; }
  .pb-reopen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  html { scroll-behavior: smooth; }

  /* ==================================================== SİPARİŞ (sepet) ====
     Yalnızca adreste masa numarası varsa açılır: ...?masa=5
     Masa yoksa menü salt okunur kalır — ekleme düğmeleri hiç görünmez.
     ======================================================================== */

  .masa-serit {
    display: none;
    padding: 8px var(--pad);
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }
  body.siparis-acik .masa-serit { display: block; }

  .ekle {
    display: none;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--accent);
    font-size: 21px;
    line-height: 1;
    cursor: pointer;
    transition: background .16s ease, transform .16s ease;
  }
  body.siparis-acik .ekle { display: block; }
  .ekle:hover { background: var(--accent); color: var(--accent-ink); }
  .ekle:active { transform: scale(.9); }
  .ekle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ekle[data-adet]::after {
    content: attr(data-adet);
    display: block;
    font-family: var(--num);
    font-size: 10px;
  }

  body.siparis-acik .item { grid-template-columns: 64px 1fr auto 34px; }

  .hero-ekle {
    grid-column: 1 / -1;
    display: none;
    margin-top: 10px;
    padding: 11px;
    width: 100%;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  body.siparis-acik .hero-ekle { display: block; }
  .hero-ekle:hover { background: var(--accent); color: var(--accent-ink); }
  .hero-ekle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- alt sepet çubuğu --- */

  .sepet-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    width: 100%;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  body.sepet-dolu .sepet-bar { display: flex; }
  .sepet-bar .ozet { font-family: var(--num); letter-spacing: 0; font-size: 13px; opacity: .9; }
  .sepet-bar .git { margin-left: auto; }

  /* Sepet çubuğu açıkken tema barı yukarı kaysın */
  body.sepet-dolu .palette-bar { bottom: calc(72px + env(safe-area-inset-bottom)); }
  body.sepet-dolu .pb-reopen  { bottom: calc(74px + env(safe-area-inset-bottom)); }

  /* --- açılır sepet / durum ekranı --- */

  .perde {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .perde[data-acik="1"] { display: flex; }

  .sayfa {
    width: 100%;
    max-width: var(--maxw);
    max-height: 88vh;
    overflow-y: auto;
    background: var(--ink);
    border-top: 3px solid var(--accent);
    padding: 18px var(--pad) calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .sayfa-ust { display: flex; align-items: baseline; gap: 10px; }
  .sayfa-baslik {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .13em;
    font-size: 18px;
  }
  .kapat {
    margin-left: auto;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 26px;
    line-height: 1;
    padding: 0 4px;
    cursor: pointer;
  }
  .kapat:hover { color: var(--text); }
  .kapat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sepet-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .sepet-satir {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--rule);
  }
  .sepet-ad { font-size: 15px; }
  .sepet-birim { display: block; font-family: var(--num); font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .adet-kutu { display: flex; align-items: center; gap: 2px; }
  .adet-dug {
    width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--text);
    font-size: 17px; line-height: 1;
    cursor: pointer;
  }
  .adet-dug:hover { border-color: var(--accent); color: var(--accent); }
  .adet-dug:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .adet-sayi {
    min-width: 30px;
    text-align: center;
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }
  .sepet-tutar {
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    min-width: 5.5em;
    text-align: right;
  }

  .not-alan {
    width: 100%;
    min-height: 64px;
    padding: 11px;
    background: var(--ink-2);
    border: 1px solid var(--rule);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    resize: vertical;
  }
  .not-alan:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  .etiket {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: 10.5px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .toplam-satir {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 6px;
    border-top: 1px solid var(--rule);
  }
  .toplam-satir .etiket { margin: 0; }
  .toplam-tutar { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 700; }

  .buyuk-dugme {
    width: 100%;
    padding: 15px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .buyuk-dugme:hover { filter: brightness(1.08); }
  .buyuk-dugme:disabled { opacity: .5; cursor: default; filter: none; }
  .buyuk-dugme:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .ikincil-dugme {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--muted);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-size: 12.5px;
    cursor: pointer;
  }
  .ikincil-dugme:hover { color: var(--text); }

  /* ==========================================================================
     3) SAYFAYI KUR

  // Türkçe dil etiketi: CSS'in otomatik büyük harfi "i" yerine "İ" üretsin
  document.documentElement.lang = "tr";

  const root  = document.getElementById("menuRoot");
  const track = document.getElementById("jumpTrack");

  const adresAyar = new URLSearchParams(location.search);

  // Masa numarası adresten gelir: ...?masa=5  → yoksa menü salt okunur kalır
  const MASA = (adresAyar.get("masa") || "").trim();
  const siparisAcik = MASA !== "";

  // ?supabase=1 → gerçek sunucu modunu dosyayı değiştirmeden dene.
  // Kalıcı açmak için siparis-servisi.js içindeki SiparisAyar.mod değerini değiştir.
  if (adresAyar.get("supabase") === "1") window.SiparisAyar.mod = "supabase";

  const ekleDugmeleri = new Map();   // ürün adı → "+" düğmesi
  const sepet = new Map();           // ürün adı → { ad, fiyat, fiyatMetin, adet }

  /** Ürün görseli: fotoğraf varsa fotoğraf, yoksa çizim. */
  function gorselYap(item, varsayilanArt, sinif, varyant) {
    const box = document.createElement("div");
    box.className = sinif;
    if (varyant !== undefined) box.dataset.v = String(varyant % 4);

    if (item.photo) {
      const img = document.createElement("img");
      img.src = item.photo;
      img.alt = item.name;
      img.loading = "lazy";
      box.appendChild(img);
      return box;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 64 64");
    svg.setAttribute("aria-hidden", "true");
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#art-" + (item.art || varsayilanArt || "tost"));
    svg.appendChild(use);
    box.appendChild(svg);
    return box;
  }

  function fiyatYap(item, sinif) {
    const el = document.createElement("p");
    el.className = sinif;
    el.textContent = item.price;
    const cur = document.createElement("span");
    cur.className = "cur";
    cur.textContent = "TL";
    el.appendChild(cur);
    return el;
  }

  for (const course of MENU) {
    const chip = document.createElement("a");
    chip.className = "chip";
    chip.href = "#" + course.id;
    chip.textContent = course.nav;
    chip.dataset.target = course.id;
    track.appendChild(chip);

    const section = document.createElement("section");
    section.className = "course";
    section.id = course.id;

    const head = document.createElement("h2");
    head.className = "course-head";
    head.textContent = course.title;
    section.appendChild(head);

    const list = document.createElement("ul");
    list.className = "items";

    let sira = 0;

    for (const item of course.items) {
      const li = document.createElement("li");

      if (item.star) {
        li.className = "item hero";
        li.appendChild(gorselYap(item, course.art, "hero-art"));

        const body = document.createElement("div");
        body.className = "hero-body";

        if (item.tag) {
          const tag = document.createElement("span");
          tag.className = "hero-tag";
          tag.textContent = item.tag;
          body.appendChild(tag);
        }

        const name = document.createElement("h3");
        name.className = "hero-name";
        name.textContent = item.name;
        body.appendChild(name);

        body.appendChild(fiyatYap(item, "hero-price"));

        if (item.note) {
          const desc = document.createElement("p");
          desc.className = "hero-desc";
          desc.textContent = item.note;
          body.appendChild(desc);
        }

        const heroEkle = document.createElement("button");
        heroEkle.className = "hero-ekle";
        heroEkle.type = "button";
        heroEkle.textContent = "Siparişe ekle";
        heroEkle.addEventListener("click", () => sepeteEkle(item));
        body.appendChild(heroEkle);
        ekleDugmeleri.set(item.name, heroEkle);

        li.appendChild(body);
        list.appendChild(li);
        continue;
      }

      li.className = "item";
      li.appendChild(gorselYap(item, course.art, "thumb", sira++));

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = item.name;
      if (item.note) {
        const note = document.createElement("span");
        note.className = "item-note";
        note.textContent = item.note;
        name.appendChild(note);
      }
      li.appendChild(name);
      li.appendChild(fiyatYap(item, "item-price"));

      const ekle = document.createElement("button");
      ekle.className = "ekle";
      ekle.type = "button";
      ekle.textContent = "+";
      ekle.setAttribute("aria-label", item.name + " siparişe ekle");
      ekle.addEventListener("click", () => sepeteEkle(item));
      li.appendChild(ekle);
      ekleDugmeleri.set(item.name, ekle);

      list.appendChild(li);
    }

    section.appendChild(list);
    root.appendChild(section);
  }

  document.getElementById("updated").textContent = "Son güncelleme " + GUNCELLEME;

  /* --- Kaydırdıkça üstteki şeritte aktif bölümü işaretle --- */

  const chips = new Map([...track.querySelectorAll(".chip")].map(c => [c.dataset.target, c]));

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      for (const c of chips.values()) c.removeAttribute("aria-current");
      const active = chips.get(entry.target.id);
      if (!active) continue;
      active.setAttribute("aria-current", "true");
      active.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }
  }, { rootMargin: "-56px 0px -70% 0px", threshold: 0 });

  for (const section of root.querySelectorAll(".course")) observer.observe(section);

  /* --- Renk şeması barı --- */

  const swatchBox = document.getElementById("paletteSwatches");
  const bar       = document.getElementById("paletteBar");
  const closeBtn  = document.getElementById("paletteClose");
  const reopenBtn = document.getElementById("paletteReopen");
  const themeMeta = document.querySelector('meta[name="theme-color"]');

  function paletUygula(id) {
    const p = PALETLER.find(x => x.id === id) || PALETLER[0];
    document.documentElement.dataset.palette = p.id;
    if (themeMeta) themeMeta.setAttribute("content", p.ground);
    for (const btn of swatchBox.children) {
      btn.setAttribute("aria-pressed", String(btn.dataset.palette === p.id));
    }
    try { localStorage.setItem("qrmenu-palet", p.id); } catch (e) { /* gizli sekme */ }
  }

  for (const p of PALETLER) {
    const btn = document.createElement("button");
    btn.className = "swatch";
    btn.type = "button";
    btn.dataset.palette = p.id;
    btn.title = p.ad + " — " + p.icin;
    btn.setAttribute("aria-label", p.ad + " renk şeması. " + p.icin + ".");
    btn.style.background =
      "linear-gradient(135deg, " + p.ground + " 0 50%, " + p.accent + " 50% 100%)";
    btn.addEventListener("click", () => paletUygula(p.id));
    swatchBox.appendChild(btn);
  }

  let kayitli = null;
  try { kayitli = localStorage.getItem("qrmenu-palet"); } catch (e) { /* gizli sekme */ }
  paletUygula(kayitli || VARSAYILAN_PALET);

  closeBtn.addEventListener("click", () => {
    bar.hidden = true;
    reopenBtn.hidden = false;
    reopenBtn.focus();
  });
  reopenBtn.addEventListener("click", () => {
    bar.hidden = false;
    reopenBtn.hidden = true;
    closeBtn.focus();
  });

  /* ==========================================================================
     4) SİPARİŞ
     Masa numarası adresten okunur: index.html?masa=5
     Masa yoksa hiçbir sipariş arayüzü açılmaz — menü salt okunur kalır.
     ========================================================================== */

  const SEPET_ANAHTAR  = "qrmenu-sepet-masa-" + MASA;
  const SIPARIS_ANAHTAR = "qrmenu-son-siparis-masa-" + MASA;

  const sepetBar    = document.getElementById("sepetBar");
  const sepetPerde  = document.getElementById("sepetPerde");
  const durumPerde  = document.getElementById("durumPerde");
  const sepetListe  = document.getElementById("sepetListe");
  const notAlan     = document.getElementById("siparisNotu");
  const gonderDug   = document.getElementById("siparisGonder");

  let takipBirak = null;

  if (siparisAcik) {
    document.body.classList.add("siparis-acik");
    document.getElementById("masaSerit").textContent = "Masa " + MASA + " · Sipariş verebilirsiniz";
  }

  /* ------------------------------------------------------------ sepet ---- */

  function sepetiKaydet() {
    if (!siparisAcik) return;
    try { localStorage.setItem(SEPET_ANAHTAR, JSON.stringify([...sepet.values()])); }
    catch (e) { /* gizli sekme */ }
  }

  function sepetiYukle() {
    if (!siparisAcik) return;
    try {
      const kayit = JSON.parse(localStorage.getItem(SEPET_ANAHTAR)) || [];
      for (const s of kayit) sepet.set(s.ad, s);
    } catch (e) { /* yok say */ }
  }

  function sepeteEkle(item) {
    if (!siparisAcik) return;
    const mevcut = sepet.get(item.name);
    if (mevcut) {
      mevcut.adet += 1;
    } else {
      sepet.set(item.name, {
        ad: item.name,
        fiyat: SiparisServisi.fiyatSayi(item.price),
        fiyatMetin: item.price,
        adet: 1
      });
    }
    sepetiCiz();
  }

  function adetDegistir(ad, fark) {
    const s = sepet.get(ad);
    if (!s) return;
    s.adet += fark;
    if (s.adet <= 0) sepet.delete(ad);
    sepetiCiz();
  }

  function sepetToplami() {
    let t = 0;
    for (const s of sepet.values()) t += s.fiyat * s.adet;
    return t;
  }

  function sepetAdedi() {
    let n = 0;
    for (const s of sepet.values()) n += s.adet;
    return n;
  }

  function satirlariCiz(hedef, kalemler, duzenlenebilir) {
    hedef.textContent = "";
    for (const s of kalemler) {
      const li = document.createElement("li");
      li.className = "sepet-satir";

      const ad = document.createElement("div");
      ad.className = "sepet-ad";
      ad.textContent = s.ad;
      const birim = document.createElement("span");
      birim.className = "sepet-birim";
      birim.textContent = SiparisServisi.paraYaz(s.fiyat) + " TL / adet";
      ad.appendChild(birim);
      li.appendChild(ad);

      if (duzenlenebilir) {
        const kutu = document.createElement("div");
        kutu.className = "adet-kutu";

        const eksi = document.createElement("button");
        eksi.className = "adet-dug";
        eksi.type = "button";
        eksi.textContent = "−";
        eksi.setAttribute("aria-label", s.ad + " adedini azalt");
        eksi.addEventListener("click", () => adetDegistir(s.ad, -1));

        const sayi = document.createElement("span");
        sayi.className = "adet-sayi";
        sayi.textContent = s.adet;

        const arti = document.createElement("button");
        arti.className = "adet-dug";
        arti.type = "button";
        arti.textContent = "+";
        arti.setAttribute("aria-label", s.ad + " adedini artır");
        arti.addEventListener("click", () => adetDegistir(s.ad, 1));

        kutu.append(eksi, sayi, arti);
        li.appendChild(kutu);
      } else {
        const sayi = document.createElement("span");
        sayi.className = "adet-sayi";
        sayi.textContent = s.adet + "×";
        li.appendChild(sayi);
      }

      const tutar = document.createElement("span");
      tutar.className = "sepet-tutar";
      tutar.textContent = SiparisServisi.paraYaz(s.fiyat * s.adet) + " TL";
      li.appendChild(tutar);

      hedef.appendChild(li);
    }
  }

  function sepetiCiz() {
    const adet = sepetAdedi();
    const toplam = sepetToplami();

    document.body.classList.toggle("sepet-dolu", adet > 0);
    document.getElementById("sepetOzet").textContent =
      adet + " ürün · " + SiparisServisi.paraYaz(toplam) + " TL";

    for (const [ad, dug] of ekleDugmeleri) {
      const s = sepet.get(ad);
      if (s) dug.dataset.adet = s.adet;
      else delete dug.dataset.adet;
    }

    satirlariCiz(sepetListe, [...sepet.values()], true);
    document.getElementById("sepetToplam").textContent = SiparisServisi.paraYaz(toplam) + " TL";
    gonderDug.disabled = adet === 0;

    if (adet === 0) perdeKapat(sepetPerde);
    sepetiKaydet();
  }

  /* ------------------------------------------------------------ perde ---- */

  function perdeAc(perde) { perde.dataset.acik = "1"; document.body.style.overflow = "hidden"; }
  function perdeKapat(perde) { delete perde.dataset.acik; document.body.style.overflow = ""; }

  sepetBar.addEventListener("click", () => perdeAc(sepetPerde));
  document.getElementById("sepetKapat").addEventListener("click", () => perdeKapat(sepetPerde));
  document.getElementById("durumKapat").addEventListener("click", () => perdeKapat(durumPerde));
  document.getElementById("yeniSiparis").addEventListener("click", () => perdeKapat(durumPerde));

  for (const p of [sepetPerde, durumPerde]) {
    p.addEventListener("click", e => { if (e.target === p) perdeKapat(p); });
  }
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    perdeKapat(sepetPerde);
    perdeKapat(durumPerde);
  });

  document.getElementById("sepetBosalt").addEventListener("click", () => {
    sepet.clear();
    sepetiCiz();
  });

  /* --------------------------------------------------------- gönderme ---- */

  const DURUM_GORUNUM = {
    yeni:         { ikon: "✓",  ad: "Alındı",        aciklama: "Siparişiniz mutfağa iletildi.", adim: 1 },
    hazirlaniyor: { ikon: "🔥", ad: "Hazırlanıyor",  aciklama: "Siparişiniz hazırlanıyor.",     adim: 2 },
    hazir:        { ikon: "🍽", ad: "Hazır",         aciklama: "Siparişiniz masanıza getiriliyor.", adim: 3 },
    teslim:       { ikon: "🙏", ad: "Teslim edildi", aciklama: "Afiyet olsun!",                 adim: 3 },
    iptal:        { ikon: "✕",  ad: "İptal edildi",  aciklama: "Lütfen görevliye danışın.",     adim: 0 }
  };

  function durumuGoster(siparis) {
    const g = DURUM_GORUNUM[siparis.durum] || DURUM_GORUNUM.yeni;
    document.getElementById("durumIkon").textContent = g.ikon;
    document.getElementById("durumAd").textContent = g.ad;
    document.getElementById("durumAciklama").textContent = g.aciklama;

    const adimlar = document.getElementById("durumAdimlar").children;
    for (let i = 0; i < adimlar.length; i++) {
      adimlar[i].classList.toggle("gecti", i < g.adim);
    }

    satirlariCiz(document.getElementById("durumListe"), siparis.urunler, false);
    document.getElementById("durumToplam").textContent = SiparisServisi.paraYaz(siparis.toplam) + " TL";
    document.getElementById("durumNot").textContent =
      "Masa " + siparis.masa + " · Sipariş no " + siparis.id.slice(-4).toUpperCase() +
      (siparis.siparisNotu ? " · Notunuz: " + siparis.siparisNotu : "");
  }

  function siparisiTakipEt(id) {
    if (takipBirak) takipBirak();
    takipBirak = SiparisServisi.takip(id, durumuGoster);
  }

  gonderDug.addEventListener("click", async () => {
    if (!sepet.size) return;
    gonderDug.disabled = true;
    gonderDug.textContent = "Gönderiliyor…";

    try {
      const siparis = await SiparisServisi.gonder({
        masa: MASA,
        urunler: [...sepet.values()].map(s => ({ ad: s.ad, fiyat: s.fiyat, adet: s.adet })),
        toplam: sepetToplami(),
        siparisNotu: notAlan.value.trim()
      });

      try { localStorage.setItem(SIPARIS_ANAHTAR, siparis.id); } catch (e) { /* yok say */ }

      sepet.clear();
      notAlan.value = "";
      sepetiCiz();
      perdeKapat(sepetPerde);

      durumuGoster(siparis);
      perdeAc(durumPerde);
      siparisiTakipEt(siparis.id);
    } catch (e) {
      alert("Sipariş gönderilemedi: " + e.message + "\n\nLütfen görevliye haber verin.");
      console.error(e);
    } finally {
      gonderDug.textContent = "Siparişi Gönder";
      gonderDug.disabled = sepet.size === 0;
    }
  });

  /* ------------------------------------------------------------ açılış ---- */

  if (siparisAcik) {
    sepetiYukle();
    sepetiCiz();

    // Sayfa yenilenirse son siparişin durumu takip edilmeye devam etsin
    let sonId = null;
    try { sonId = localStorage.getItem(SIPARIS_ANAHTAR); } catch (e) { /* yok say */ }
    if (sonId) {
      SiparisServisi.abone(liste => {
        const s = liste.find(x => x.id === sonId);
        if (!s) return;
        if (["teslim", "iptal"].includes(s.durum)) {
          try { localStorage.removeItem(SIPARIS_ANAHTAR); } catch (e) { /* yok say */ }
        }
      });
      siparisiTakipEt(sonId);
    }
  }
</script>
